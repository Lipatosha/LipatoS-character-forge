name: Bootstrap Character Forge Source

on:
  push:
    branches:
      - main
    paths:
      - "_bootstrap/**"
      - ".github/workflows/bootstrap-character-forge.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/*.b64 | tr -d '\n\r' | base64 -d > /tmp/character-forge.zip
          rm -rf /tmp/character-forge
          mkdir -p /tmp/character-forge
          unzip -q /tmp/character-forge.zip -d /tmp/character-forge
          test -f /tmp/character-forge/module.json
          test -f /tmp/character-forge/scripts/main.js

      - name: Replace bootstrap with source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          cp -a /tmp/character-forge/. .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-character-forge.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LipatoS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Character Forge 0.1.0 source [skip ci]" || exit 0
          git push
