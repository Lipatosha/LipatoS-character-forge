name: Build Foundry release

on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - lang/**
      - README.md
      - CHANGELOG.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          zip -r character-forge.zip module.json scripts styles lang README.md CHANGELOG.md LICENSE

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}"             character-forge.zip module.json             --title "Character Forge ${{ steps.version.outputs.version }}"             --generate-notes
